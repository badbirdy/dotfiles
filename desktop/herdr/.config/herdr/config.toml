onboarding = false
# Herdr configuration managed by GNU Stow.
# tmux remains available through the separate desktop/tmux package.

[theme]
name = "catppuccin"

[theme.custom]
sidebar_bg = "#24273a"
active_row_bg = "#363a4f"
selection_bg = "#494d64"
accent = "#8bc3fa"
red = "#ed8796"
green = "#a6da95"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
# Keep the existing tmux muscle memory.
prefix = "ctrl+a"

help = "prefix+?"
workspace_picker = "prefix+w"
copy_mode = "prefix+["

new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = ["prefix+v", "prefix+shift+backslash"]
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"

goto = "prefix+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
settings = "prefix+shift+s"
new_workspace = "prefix+shift+n"
rename_workspace = ["prefix+shift+w", "prefix+shift+4"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
close_tab = ["prefix+shift+7", "prefix+shift+x"]
close_workspace = ["prefix+shift+k", "prefix+shift+d"]
detach = ["prefix+q", "prefix+d"]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
edit_scrollback = "prefix+e"
toggle_sidebar = "prefix+b"

[ui]
prompt_new_tab_name = false

mouse_capture = true
copy_on_select = true
pane_borders = true
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "datetime", format = "%Y-%m-%d %H:%M" },
]
tab_bar_right_separator = "  "
hide_tab_bar_when_single_tab = false
sidebar_start_collapsed = false

show_agent_labels_on_pane_borders = false
[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 10000000

[ui.toast]
delivery = "system"
